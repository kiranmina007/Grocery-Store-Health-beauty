  <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

    <title>Mama567 - Download App</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(145deg, #f5f7fb, #e8eef8);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .landing-card {
            width: 100%;
            max-width: 430px;
            min-height: 500px;
            background: #ffffff;
            border-radius: 28px;
            padding: 45px 25px;
            box-shadow: 0 20px 60px rgba(27, 50, 88, 0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .app-icon {
            width: 90px;
            height: 90px;
            border-radius: 24px;
            background: linear-gradient(135deg, #1455d9, #0a2d7c);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            font-weight: 800;
            margin-bottom: 25px;
            box-shadow: 0 12px 30px rgba(20, 85, 217, 0.25);
        }

        .app-name {
            font-size: 36px;
            line-height: 1.2;
            font-weight: 800;
            color: #101828;
            margin-bottom: 35px;
            word-break: break-word;
        }

        .download-button {
            width: 100%;
            max-width: 310px;
            min-height: 58px;
            border: none;
            border-radius: 16px;
            background: #1455d9;
            color: #ffffff;
            font-size: 18px;
            font-weight: 700;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.25s ease;
            box-shadow: 0 10px 25px rgba(20, 85, 217, 0.25);
        }

        .download-button:hover {
            background: #0f43ad;
            transform: translateY(-2px);
        }

        .download-button:active {
            transform: scale(0.98);
        }

        @media (max-width: 480px) {
            body {
                padding: 14px;
            }

            .landing-card {
                min-height: calc(100vh - 28px);
                padding: 35px 20px;
                border-radius: 22px;
            }

            .app-name {
                font-size: 31px;
            }

            .download-button {
                max-width: 100%;
            }
        }
    </style>
